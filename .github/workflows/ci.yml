name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      IMPORT_AUTHORITY_REPORT_DIR: ${{ runner.temp }}/import-authority-reports
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn package:vsix
      - if: runner.os == 'Linux'
        run: node benchmarks/startup.cjs f38c54992fb91cda0b962ecf8b510aab478d0cc7 9 --check
      - if: runner.os == 'Linux'
        run: |
          xvfb-run -a yarn test:host 1.110.0
          xvfb-run -a yarn test:host stable
      - if: runner.os != 'Linux'
        run: |
          yarn test:host 1.110.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          yarn test:host stable
        shell: pwsh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: host-results-${{ runner.os }}
          path: ${{ runner.temp }}/import-authority-reports
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: import-authority-vsix-${{ runner.os }}
          path: '*.vsix'
          if-no-files-found: error
  corpus:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: vue, shard: 0, shards: 1 }
          - { project: zustand, shard: 0, shards: 1 }
          - { project: tanstack-query, shard: 0, shards: 1 }
          - { project: typescript, shard: 0, shards: 4 }
          - { project: typescript, shard: 1, shards: 4 }
          - { project: typescript, shard: 2, shards: 4 }
          - { project: typescript, shard: 3, shards: 4 }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      IMPORT_AUTHORITY_CORPUS_SHARD: ${{ matrix.shard }}
      IMPORT_AUTHORITY_CORPUS_SHARDS: ${{ matrix.shards }}
      IMPORT_AUTHORITY_REPORT_DIR: ${{ runner.temp }}/import-authority-reports
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: node scripts/prepare-corpus.cjs ${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-${{ matrix.project }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/import-authority-reports
          if-no-files-found: error
