name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn package:vsix
      - uses: actions/upload-artifact@v4
        with:
          name: import-authority-vsix
          path: '*.vsix'
          if-no-files-found: error
